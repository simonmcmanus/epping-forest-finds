[build]
  publish = "."
  command = "npm run build"
  functions = "netlify/functions"
  ignore = "node netlify/ignore-draft-pr.js"

[functions]
  node_bundler = "esbuild"

# Closed alpha gate. Only the app's HTML entry points are gated -- the loose
# assets stay public so the service worker can fill its offline caches and so
# crawlers can reach robots.txt, the sitemap and the homepage. /app itself is
# not gated: it is a bare redirect to /nearby below, with no content of its
# own to protect.
# See spec/spec-alpha-access.md.
[[edge_functions]]
  function = "alpha-gate"
  path = "/nearby"

[[edge_functions]]
  function = "alpha-gate"
  path = "/nearby/search"

[[edge_functions]]
  function = "alpha-gate"
  path = "/nearby/filter"

[[edge_functions]]
  function = "alpha-gate"
  path = "/settings"

[[edge_functions]]
  function = "alpha-gate"
  path = "/feedback"

[[edge_functions]]
  function = "alpha-gate"
  path = "/community"

[[edge_functions]]
  function = "alpha-gate"
  path = "/app.html"

# CORS for the iOS/Android app, whose pages are served from the app bundle rather than this site.
# Only the two native WebView origins are allowed; admin and sign-in routes are never opened.
# See spec/spec-native.md "Networking".
[[edge_functions]]
  function = "native-cors"
  path = "/api/*"
  excludedPath = ["/api/admin/*", "/api/auth/*", "/api/community/rebuild", "/api/community/validate"]

[[edge_functions]]
  function = "native-cors"
  path = "/.netlify/functions/report-missing-data"

# /app is retired to a permanent redirect to /nearby, the app's new
# place-agnostic entry point -- not a second address for the app, and no
# content of its own, so it needs no gate (see above).
#
# force = true is required here, not cosmetic: /app would otherwise collide with the static
# file app.html through Netlify's own clean-URL resolution (which tries "<path>.html" for any
# path with no file extension) before this redirect rule ever runs, serving app.html's content
# directly at a 200 -- bypassing both the redirect AND the gate (app.html is still a gated path,
# but a static-asset hit never reaches the edge function that enforces that at all). Confirmed
# live: /app returned 200 with the app's own content instead of a 301 to /nearby until this was
# added. No other redirect in this file needs it -- none of their "from" paths collide with a
# real file on disk the way "app" collides with "app.html".
[[redirects]]
  from = "/app"
  to = "/nearby"
  status = 301
  force = true

# The pretty URLs for the map's own screens. app.html stays at the root
# rather than moving into a directory: js/nav.js registers the service
# worker relatively, so a directory move would collapse its scope and the
# app would stop working offline entirely. js/app.js's router reads
# location.pathname to know which of these it was asked for. Filter and
# Search nest under /nearby/ -- both only ever change what Nearby shows,
# never a destination in their own right -- while Settings and Report stay
# top-level, general app screens with nothing to do with Nearby itself.
# Bare /nearby is served from a generated static file (scripts/generate-find-pages.js,
# renderNearbyIndexPage) so a no-JS visitor or crawler sees the real trees list, not app.html's
# empty-state placeholder. Only this one path is pointed at it; the rest keep rewriting to app.html.
[[redirects]]
  from = "/nearby"
  to = "/nearby-index.html"
  status = 200

[[redirects]]
  from = "/nearby/search"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/nearby/filter"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/settings"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/feedback"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/community"
  to = "/app.html"
  status = 200

# Public, ungated: the City of London discrepancy report (rendered by a function from the daily
# community snapshot) and, as a static page, /contribute (contribute/index.html).
[[redirects]]
  from = "/reports/tree-report"
  to = "/.netlify/functions/tree-report"
  status = 200
  force = true

[[redirects]]
  from = "/reports/tree-report/"
  to = "/.netlify/functions/tree-report"
  status = 200
  force = true

# /report is the screen's old path; published ledgers still link to it.
[[redirects]]
