[functions."community-rebuild-scheduled"]
  schedule = "@hourly"

[functions."community-validate-scheduled"]
  schedule = "@daily"

# Folds usage-tracking batches into one file per day (netlify/functions/track-compact-scheduled.js).
[functions."track-compact-scheduled"]
  schedule = "*/10 * * * *"

