# The service worker and the version files it imports must always be revalidated: a stale copy
# means installed apps never see a release. See spec/spec-data-fetching.md "Service Worker Caching".
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/js/app-cache-version.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/js/data-cache-version.js"
  [headers.values]
    Cache-Control = "no-cache"

# The native app (whose pages are served from the app bundle, not this site) downloads changed
# datasets from here, so the public data is readable cross-origin. The manifest that lists what
# changed must never be served stale. See spec/spec-native.md "Delta updates".
[[headers]]
  for = "/data/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/data/manifest.json"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "no-cache"

# Places merged as duplicates or renamed: their old /find/<slug>/ pages move to the
