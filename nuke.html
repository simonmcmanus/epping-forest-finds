<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Refreshing Epping Forest Finds</title>
</head>
<body>
  <p>Refreshing the app cache…</p>
  <script>
    (async () => {
      // A controlled page already has the current worker available to do the safe, transactional
      // data refresh. Ask it to revalidate instead of deleting the offline shell underneath the
      // reader; the old delete-first recovery was especially surprising when the connection was
      // slow or the browser was offline. The request id also lets this page wait for completion
      // before redirecting, so the normal app boot cannot race the refresh.
      const controller = "serviceWorker" in navigator ? navigator.serviceWorker.controller : null;
      if (controller && "serviceWorker" in navigator) {
        await new Promise((resolve) => {
          const requestId = `nuke-${Date.now()}-${Math.random().toString(36).slice(2)}`;
          let timer;
          const finish = () => {
            clearTimeout(timer);
            navigator.serviceWorker.removeEventListener("message", onMessage);
            resolve();
          };
          const onMessage = (event) => {
            if (event.data?.type === "DATA_SYNC_COMPLETE" && event.data.requestId === requestId) finish();
          };
          navigator.serviceWorker.addEventListener("message", onMessage);
          timer = setTimeout(finish, 20_000);
          try {
            controller.postMessage({ type: "SYNC_DATA", force: true, requestId });
          } catch {
            finish();
          }
        });
      } else {
        // There is no active worker to refresh on a first visit or after a failed registration.
        // Only in that recovery case is it useful to remove an abandoned cache; a controlled
        // offline app must never lose its working shell just because this URL was opened.
        try {
          if ("serviceWorker" in navigator) {
            const registrations = await navigator.serviceWorker.getRegistrations();
            await Promise.all(registrations.map((registration) => registration.unregister()));
          }
        } catch (error) {
          console.error(error);
        }

        try {
          if ("caches" in window) {
            const names = await caches.keys();
            await Promise.all(
              names
                .filter((name) => name.startsWith("forest-finds-"))
                .map((name) => caches.delete(name))
            );
          }
        } catch (error) {
          console.error(error);
        }
      }

      // Keep the reader's selected filter/radius query intact while removing only this recovery
      // flag, so the refreshed page returns to the view they actually opened.
      const current = new URL(window.location.href);
      current.pathname = "/nearby";
      current.searchParams.delete("nuke");
      window.location.replace(current.href);
    })();
  </script>
</body>
</html>
