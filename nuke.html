<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Refreshing Epping Forest Finds</title>
</head>
<body>
  <p>Refreshing the app cache…</p>
  <script>
    (async () => {
      // This route is an explicit recovery action. A stale worker can be serving a broken app
      // shell, so asking that same worker to sync data is not enough: unregister it and remove
      // only this app's caches before the redirect. The next navigation must fetch a coherent
      // shell and scripts from the deploy.
      try {
        if ("serviceWorker" in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map((registration) => registration.unregister()));
        }
      } catch (error) {
        console.error(error);
      }

      try {
        if ("caches" in window) {
          const names = await caches.keys();
          await Promise.all(
            names
              .filter((name) => name.startsWith("forest-finds-"))
              .map((name) => caches.delete(name))
          );
        }
      } catch (error) {
        console.error(error);
      }

      // Keep the reader's selected filter/radius query intact while removing only this recovery
      // flag, so the refreshed page returns to the view they actually opened.
      const current = new URL(window.location.href);
      current.pathname = "/nearby";
      current.searchParams.delete("nuke");
      window.location.replace(current.href);
    })();
  </script>
</body>
</html>
