    <path d="M 330 158 C 342 165, 358 165, 370 158" stroke-width="2.4"/>

    <!-- collar and GPS unit -->
    <path d="M 300 200 C 320 228, 380 228, 400 200" stroke-width="7.5"/>
    <rect x="336" y="222" width="28" height="22" rx="5"/>
    <path d="M 343 233 L 357 233" stroke-width="2.6"/>
  </g>

  <g fill="currentColor">
    <ellipse cx="331" cy="110" rx="5" ry="4.2"/>
    <ellipse cx="369" cy="110" rx="5" ry="4.2"/>
    <ellipse cx="342" cy="170" rx="3.2" ry="2.2"/>
    <ellipse cx="358" cy="170" rx="3.2" ry="2.2"/>
  </g>
</svg>
