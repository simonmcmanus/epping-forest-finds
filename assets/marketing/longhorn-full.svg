    <path d="M 274 112 C 252 126, 236 134, 218 132 C 186 128, 148 122, 112 116 C 96 114, 80 118, 70 128 C 58 140, 54 162, 58 184 C 62 202, 72 214, 86 219 C 100 224, 118 216, 132 202 C 162 222, 200 232, 232 234 C 252 235, 268 232, 278 224 C 288 216, 294 202, 294 184 C 294 156, 286 128, 274 112 Z"/>

