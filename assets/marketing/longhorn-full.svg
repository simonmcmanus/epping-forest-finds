    <path d="M 274 112 C 288 106, 306 98, 320 92"/>
    <path d="M 330 168 C 320 190, 306 200, 294 192"/>

    <!-- horns -->
    <path d="M 338 74 C 306 62, 268 54, 242 38 C 236 34, 230 28, 226 20 C 231 31, 239 40, 247 47 C 274 68, 308 84, 326 94 Z"/>
    <path d="M 362 74 C 394 62, 432 54, 458 38 C 464 34, 470 28, 474 20 C 469 31, 461 40, 453 47 C 426 68, 392 84, 374 94 Z"/>

