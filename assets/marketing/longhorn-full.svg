<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 330" width="490" height="330" role="img" aria-label="Line drawing of an English Longhorn cow wearing a GPS tracking collar">
  <g fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">

