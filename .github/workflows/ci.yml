name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  push:
    branches: [main]
  # Manual "Run workflow" button. The weekly-ledger workflow no longer needs
  # it: that job pushes and opens PRs as WEEKLY_LEDGER_PAT rather than its own
  # GITHUB_TOKEN, so the pull_request event above fires normally and its PRs
  # get checks without anyone pressing anything. Kept for ad-hoc re-runs.
  workflow_dispatch: {}

jobs:
  changes:
    # Decides whether unit and E2E run. They are skipped for a label event, and for a push that
    # only touches test/e2e/__screenshots__/ (the update-snapshots baseline commit). The visual
    # job always runs, so a baseline commit is checked by it alone.
    name: Changed files
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.check.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check for non-snapshot changes
        id: check
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            code=true
          elif [ "$ACTION" = "labeled" ]; then
            code=false
          else
            files=$(git diff --name-only "$BEFORE" HEAD 2>/dev/null) || files=""
            if [ -z "$files" ] || echo "$files" | grep -qv '^test/e2e/__screenshots__/'; then
              code=true
            else
              code=false
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  unit:
    name: Unit tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: npm ci
      # Runs both the JS suites and the scripts/test_*.py suite (report
      # rendering, the OSM/cow-boundary diff logic, etc.) -- see
      # package.json's "test" script.
      - run: npm test

  e2e:
    # One Playwright project per runner, rather than both on one. A GitHub-hosted runner has
    # 2 vCPUs; running the whole suite on a single one meant 4 workers sharing them, which
    # starved the app's boot-and-draw cycle and failed whole spec files in `beforeEach`. Two
    # runners at 2 workers each (see playwright.config.js) gives every worker a full core for
    # the same total parallelism. Each project is additionally split into five shards so the
    # ten resulting jobs run concurrently and cut this job's wall-clock well below one shard
    # per project -- a public repo on the free plan has no Actions-minutes cost and a generous
    # concurrent-job budget, so there is no reason to leave this parallelism on the table.
    # fail-fast is off so one shard's failure still lets the others report.
    #
    # This job excludes every "snapshot: ..." test (see the `visual-snapshots` job below) --
    # it only ever carries functional assertions, so a red check here always means a real
    # behavioural regression, never a pixel-diff flake.
    #
    # container pins the exact image Playwright publishes for this repo's own
    # @playwright/test version and ubuntu-latest's codename (noble/24.04), with Chromium and
    # every OS dependency already baked in. That replaces the separate
    # "npx playwright install --with-deps chromium" step -- which re-downloaded the browser and
    # apt-installed fonts/libs from scratch on every job, ~25-30s of setup and a network
    # dependency on cdn.playwright.dev/the apt mirrors that added nothing but risk. Bump this
    # tag only in lockstep with the @playwright/test version in package.json.
    name: E2E tests (${{ matrix.project }}, shard ${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, mobile]
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build pages before browser tests
        run: npm run build
      - name: Run E2E tests
        run: >
          npx playwright test --project=${{ matrix.project }}
          --grep-invert "snapshot:" --shard=${{ matrix.shard }}/5
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          # Per project+shard, or the jobs collide on one artifact name.
          name: playwright-report-${{ matrix.project }}-shard${{ matrix.shard }}
          path: playwright-report/
          retention-days: 14

  visual-snapshots:
    # The "snapshot: ..." tests only (see the `e2e` job above for everything else), as their
    # own check so a pixel-diff shows up as "Visual snapshots (desktop + mobile)" rather than muddying
    # "E2E tests" -- the two have very different reliability characteristics and a failure in
    # one says nothing about the other. The public surfaces have desktop and mobile baselines;
    # the existing app snapshots remain mobile-only except for the tree detail view, which now
    # runs on both projects.
    #
    # --retries=1, unlike the e2e job's retries:0: canvas screenshot diffs here have repeatedly
    # proven non-deterministic on an otherwise-unchanged commit (see spec/agents.md), where the
    # e2e job's functional assertions have not. A retry absorbs that known noise instead of
    # requiring a human to notice and re-run CI by hand; a genuine visual regression still fails
    # twice and stays red.
    # A pixel diff fails this job, after the diff table has been published to the PR description.
    # The update-snapshots label copies the failing renders over their baselines on that run, so the
    # job passes once the baseline commit is on the branch. The snapshot runs are continue-on-error so a diff
    # still reaches the commit and publish steps.
    name: Visual snapshots (desktop + mobile)
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          # Must be a PAT, not this job's own GITHUB_TOKEN -- same reason, same fix, as
          # sw-release.yml's and data-bump.yml's own bump commits (see either header).
          # GitHub fires no pull_request/push event for anything GITHUB_TOKEN pushed, so a
          # baseline commit authored by it would become the PR's new head with no CI run ever
          # against it: this check would read green while having tested a now-stale commit. A
          # PAT is an ordinary user credential, so this push triggers a real `synchronize`
          # event and ci.yml runs again against the exact commit that ends up on main.
          token: ${{ secrets.WEEKLY_LEDGER_PAT }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check for the update-snapshots label
        # Both runs only write missing baselines, so a mismatch fails and leaves its render in
        # test-results. With the label, the 'Apply failing renders' step copies those renders over
        # their baselines, so only snapshots that differ by more than the tolerance are committed.
        id: mode
        run: echo "value=${{ contains(github.event.pull_request.labels.*.name, 'update-snapshots') && 'apply' || 'report' }}" >> "$GITHUB_OUTPUT"
      - name: Run visual snapshot tests (mobile)
        id: mobile
        # continue-on-error so the commit step always runs even when baselines are missing.
        # Playwright's "missing" mode writes new baselines but still exits non-zero --
        # the explicit fail step below re-surfaces any genuine failures.
        run: >
          npx playwright test --project=mobile --grep "snapshot:"
          --update-snapshots=missing --retries=1
        continue-on-error: true
      - name: Run visual snapshot tests (desktop)
        id: desktop
        run: >
          npx playwright test --project=desktop --grep "snapshot:"
          --update-snapshots=missing --retries=1
        continue-on-error: true
      - name: Clear the update-snapshots label
        # Removed before the commit below, so the push's own CI run is not regenerating again.
        if: github.event_name == 'pull_request' && steps.mode.outputs.value == 'apply'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.removeLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              name: 'update-snapshots',
            }).catch((error) => {
              if (error.status !== 404) throw error;
            });
      - name: Apply failing renders to their baselines
        # Each *-actual.png is a render that differs from its baseline by more than the tolerance,
        # so copying it over the baseline is the regeneration the label asks for. Passing snapshots
        # produce no actual file and keep their committed baseline.
        if: steps.mode.outputs.value == 'apply'
        run: |
          find test-results -name '*-actual.png' | sort | while read -r actual; do
            stem=$(basename "$actual" -actual.png)
            project=$(basename "$(dirname "$actual")" | grep -oE 'desktop|mobile' | tail -n 1 || true)
            cp "$actual" "test/e2e/__screenshots__/$stem-$project-linux.png"
          done
      - name: Commit new snapshot baselines
        # Runs even after test failure. git add only touches test/e2e/__screenshots__/, so
        # regression diffs (written to test-results/ as "actual") are never committed.
        #
        # No [skip ci]: a push to a PR branch should always get a real CI run against the exact
        # commit that ends up on main, same reasoning as sw-release.yml/data-bump.yml. The PAT
        # above is what actually makes that push fire a `synchronize` event in the first place;
        # without it this commit would sit as the PR's new head completely unchecked.
        #
        # The explicit cd + safe.directory: actions/checkout's own safe.directory registration
        # happens to run too late to help a mid-job step in this container image -- without
        # them this step failed outright with "fatal: not in a git directory" the first time
        # this job ran containerized, before any of the actual git commands below got a chance
        # to execute.
        run: |
          cd "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/e2e/__screenshots__/
          if ! git diff --staged --quiet; then
            git commit -m "chore: add CI snapshot baselines"
            git checkout -- .
            git clean -fd
            git pull --rebase origin ${{ github.head_ref || github.ref_name }}
            git push origin HEAD:${{ github.head_ref || github.ref_name }}
          fi
      - name: Publish failing snapshot diffs
        # Fork PRs have no PAT, so they skip publishing. Their diffs stay in the Playwright report.
        if: >
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PAT: ${{ secrets.WEEKLY_LEDGER_PAT }}
        run: bash .github/scripts/publish-visual-diffs.sh
      - name: Write failing snapshots into the PR description
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const section = fs.existsSync(`${process.env.RUNNER_TEMP}/visual-section.md`)
              ? fs.readFileSync(`${process.env.RUNNER_TEMP}/visual-section.md`, 'utf8').trim()
              : '';
            const start = '<!-- visual-failures:start -->';
            const end = '<!-- visual-failures:end -->';
            const block = `${start}\n${section}\n${end}`;
            const marker = new RegExp(`${start}[\\s\\S]*?${end}`);
            // Read the current body rather than the event payload, which is stale by now.
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });
            const body = pr.body || '';
            let next = body;
            if (marker.test(body)) next = body.replace(marker, () => block);
            else if (section) next = `${body.trim()}\n\n${block}\n`;
            if (next !== body) {
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                body: next,
              });
            }
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-visual
          path: playwright-report/
          retention-days: 14
      - name: Fail if visual snapshot tests had failures
        if: steps.mobile.outcome == 'failure' || steps.desktop.outcome == 'failure'
        run: exit 1
