name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  # Manual "Run workflow" button. The weekly-ledger workflow no longer needs
  # it: that job pushes and opens PRs as WEEKLY_LEDGER_PAT rather than its own
  # GITHUB_TOKEN, so the pull_request event above fires normally and its PRs
  # get checks without anyone pressing anything. Kept for ad-hoc re-runs.
  workflow_dispatch: {}

jobs:
  changes:
    # Decides whether unit and functional E2E run. The visual job always runs, so a CI-generated
    # baseline commit is checked by it alone.
    name: Changed files
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.check.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # A pull_request checkout normally points at a synthetic merge commit. For the
          # snapshot-only commit optimization below we need the PR head and its parent instead.
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Check for non-snapshot changes
        id: check
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            code=true
          elif [ "$ACTION" != "synchronize" ]; then
            # The first run for a PR (or a re-opened/ready-for-review PR) must not be skipped,
            # even when its branch already has several commits.
            code=true
          else
            # pull_request payloads do not have github.event.before. On synchronize, HEAD is the
            # new PR head and HEAD^ is the previous head, which is exactly the commit pushed by
            # the author or by the trusted snapshot publisher.
            files=$(git diff --name-only HEAD^ HEAD 2>/dev/null) || files=""
            if [ -z "$files" ] || echo "$files" | grep -qv '^test/e2e/__screenshots__/'; then
              code=true
            else
              code=false
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  unit:
    name: Unit tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: npm ci
      # Runs both the JS suites and the scripts/test_*.py suite (report
      # rendering, the OSM/cow-boundary diff logic, etc.) -- see
      # package.json's "test" script.
      - run: npm test

  e2e:
    # One Playwright project per runner, rather than both on one. A GitHub-hosted runner has
    # 2 vCPUs; running the whole suite on a single one meant 4 workers sharing them, which
    # starved the app's boot-and-draw cycle and failed whole spec files in `beforeEach`. Two
    # runners at 2 workers each (see playwright.config.js) gives every worker a full core for
    # the same total parallelism. Each project is additionally split into five shards so the
    # ten resulting jobs run concurrently and cut this job's wall-clock well below one shard
    # per project -- a public repo on the free plan has no Actions-minutes cost and a generous
    # concurrent-job budget, so there is no reason to leave this parallelism on the table.
    # fail-fast is off so one shard's failure still lets the others report.
    #
    # This job excludes every "snapshot: ..." test (see the `visual-snapshots` job below) --
    # it only ever carries functional assertions, so a red check here always means a real
    # behavioural regression, never a pixel-diff flake.
    #
    # container pins the exact image Playwright publishes for this repo's own
    # @playwright/test version and ubuntu-latest's codename (noble/24.04), with Chromium and
    # every OS dependency already baked in. That replaces the separate
    # "npx playwright install --with-deps chromium" step -- which re-downloaded the browser and
    # apt-installed fonts/libs from scratch on every job, ~25-30s of setup and a network
    # dependency on cdn.playwright.dev/the apt mirrors that added nothing but risk. Bump this
    # tag only in lockstep with the @playwright/test version in package.json.
    name: E2E tests (${{ matrix.project }}, shard ${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, mobile]
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build pages before browser tests
        run: npm run build
      - name: Run E2E tests
        run: >
          npx playwright test --project=${{ matrix.project }}
          --grep-invert "snapshot:" --shard=${{ matrix.shard }}/5
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          # Per project+shard, or the jobs collide on one artifact name.
          name: playwright-report-${{ matrix.project }}-shard${{ matrix.shard }}
          path: playwright-report/
          retention-days: 14

  visual-snapshots:
    # The "snapshot: ..." tests only (see the `e2e` job above for everything else), as their
    # own check so a pixel-diff shows up as "Visual snapshots (desktop + mobile)" rather than muddying
    # "E2E tests" -- the two have very different reliability characteristics and a failure in
    # one says nothing about the other. The public surfaces have desktop and mobile baselines;
    # the existing app snapshots remain mobile-only except for the tree detail view, which now
    # runs on both projects.
    #
    # --retries=1, unlike the e2e job's retries:0: canvas screenshot diffs here have repeatedly
    # proven non-deterministic on an otherwise-unchanged commit (see spec/agents.md), where the
    # e2e job's functional assertions have not. A retry absorbs that known noise instead of
    # requiring a human to notice and re-run CI by hand; a genuine visual regression still fails
    # twice and stays red.
    # A pixel diff fails this job. The trusted workflow_run publisher consumes the uploaded
    # renders, updates the PR description, and commits the new baselines to same-repository PRs.
    # That commit starts a fresh CI run against the exact head that reviewers will merge. Fork PRs
    # get the same review images but cannot receive an automatic commit into the fork.
    name: Visual snapshots (desktop + mobile)
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run visual snapshot tests (mobile)
        id: mobile
        # Missing baselines are generated in the workspace and uploaded below. Mismatches leave
        # *-actual.png and *-diff.png in test-results for the trusted publisher.
        run: |
          bash -o pipefail -c '
            set +e
            npx playwright test --project=mobile --grep "snapshot:" \
              --update-snapshots=missing --retries=1
            status=$?
            set -e
            [ ! -d test-results ] || mv test-results test-results-mobile
            exit $status
          '
        continue-on-error: true
      - name: Run visual snapshot tests (desktop)
        id: desktop
        run: |
          bash -o pipefail -c '
            set +e
            npx playwright test --project=desktop --grep "snapshot:" \
              --update-snapshots=missing --retries=1
            status=$?
            set -e
            [ ! -d test-results ] || mv test-results test-results-desktop
            exit $status
          '
        continue-on-error: true
      - name: Upload visual snapshot candidates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-visual-candidates
          path: |
            test-results-mobile/
            test-results-desktop/
            test/e2e/__screenshots__/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-visual
          path: playwright-report/
          retention-days: 14
      - name: Fail if visual snapshot tests had failures
        if: steps.mobile.outcome == 'failure' || steps.desktop.outcome == 'failure'
        run: exit 1
