name: Publish native artifact links

on:
  workflow_run:
    workflows: [Native artifacts]
    types: [completed]

permissions:
  actions: read
  pull-requests: write

concurrency:
  group: native-artifact-publisher-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the current pull request
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            let candidates = run.pull_requests || [];
            if (!candidates.length) {
              const response = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: run.head_sha,
              });
              candidates = response.data;
            }
            const candidate = candidates[0];
            if (!candidate) {
              core.setOutput('process', 'false');
              return;
            }

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: candidate.number,
            });
            if (pr.state !== 'open' || pr.head.sha !== run.head_sha) {
              core.info(`Skipping stale or closed PR run: ${run.head_sha}`);
              core.setOutput('process', 'false');
              return;
            }

            core.setOutput('process', 'true');
            core.setOutput('number', String(pr.number));

      - name: List artifacts from the native build
        id: artifacts
        if: steps.pr.outputs.process == 'true'
        uses: actions/github-script@v7
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: Number(process.env.RUN_ID),
              per_page: 100,
            });
            const wanted = new Set(['ios-simulator-app', 'android-debug-apk']);
            const artifacts = data.artifacts
              .filter((artifact) => wanted.has(artifact.name) && !artifact.expired)
              .sort((a, b) => a.name.localeCompare(b.name));
            core.setOutput('json', JSON.stringify(artifacts.map((artifact) => ({
              name: artifact.name,
              url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${process.env.RUN_ID}/artifacts/${artifact.id}`,
            })));

      - name: Update the PR description
        if: steps.pr.outputs.process == 'true'
        uses: actions/github-script@v7
        env:
          ARTIFACTS_JSON: ${{ steps.artifacts.outputs.json }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        with:
          script: |
            const marker = /<!-- native-artifacts:start -->[\s\S]*?<!-- native-artifacts:end -->/;
            const prNumber = Number('${{ steps.pr.outputs.number }}');
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            const artifacts = JSON.parse(process.env.ARTIFACTS_JSON || '[]');
            const labels = {
              'android-debug-apk': 'Android debug APK',
              'ios-simulator-app': 'iOS Simulator app',
            };
            const lines = [
              `Build: [${process.env.RUN_CONCLUSION}](${process.env.RUN_URL})`,
            ];
            if (artifacts.length) {
              lines.push('', ...artifacts.map((artifact) => `- [${labels[artifact.name] || artifact.name}](${artifact.url})`));
            } else if (process.env.RUN_CONCLUSION === 'success') {
              lines.push('', '_No native projects are present in this pull request._');
            } else {
              lines.push('', '_No downloadable artifacts were produced._');
            }

            const replacement = `<!-- native-artifacts:start -->\n${lines.join('\n')}\n<!-- native-artifacts:end -->`;
            const body = pr.body || '';
            if (!marker.test(body) && !artifacts.length && process.env.RUN_CONCLUSION === 'success') return;
            const next = marker.test(body)
              ? body.replace(marker, replacement)
              : `${body.trim()}\n\n## Native test artifacts\n\n${replacement}\n`;
            if (next !== body) {
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                body: next,
              });
            }
