name: Update visual diff links

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  update-pr:
    # Lists the toHaveScreenshot() baselines this PR changes and writes before/after links to
    # the committed PNGs into the PR body. The images are already in git, so this only links
    # them: `before` is the base commit, `after` is this head commit. A fork's token is
    # read-only, so its body cannot be edited and the step fails there; the author adds the
    # links by hand in that case (see agents.md).
    runs-on: ubuntu-latest
    steps:
      - name: Add changed snapshot links to the pull request
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const prefix = "test/e2e/__screenshots__/";
            const rawUrl = (sha, file) =>
              `https://raw.githubusercontent.com/${context.repo.owner}/${context.repo.repo}/${sha}/${file}`;

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            });
            const snapshots = files.filter((file) => file.filename.startsWith(prefix) && file.filename.endsWith(".png"));

            const section = snapshots.length
              ? [
                  "### Visual changes",
                  "",
                  "| Snapshot | Before | After |",
                  "| --- | --- | --- |",
                  ...snapshots.map((file) => {
                    const name = file.filename.slice(prefix.length, -".png".length);
                    const before = file.status === "added" ? "_new_" : `![before](${rawUrl(pr.base.sha, file.filename)})`;
                    const after = file.status === "removed" ? "_removed_" : `![after](${rawUrl(pr.head.sha, file.filename)})`;
                    return `| \`${name}\` | ${before} | ${after} |`;
                  }),
                ].join("\n")
              : "";

            const marker = /<!-- visual-diffs:start -->[\s\S]*?<!-- visual-diffs:end -->/;
            // Read the current body: the visual job edits the description too, and the event
            // payload is from when this run started.
            const { data: current } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
            });
            const body = current.body || "";
            const replacement = `<!-- visual-diffs:start -->\n${section}\n<!-- visual-diffs:end -->`;
            let nextBody;
            if (marker.test(body)) {
              nextBody = body.replace(marker, replacement);
            } else if (section) {
              nextBody = `${body.trim()}\n\n${replacement}\n`;
            } else {
              nextBody = body;
            }
            if (nextBody === body) return;

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              body: nextBody,
            });
