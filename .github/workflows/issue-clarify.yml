name: Issue clarification

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  issues: write
  id-token: write

jobs:
  clarify:
    name: Ask clarifying questions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event.sender.login != 'claude[bot]' && !github.event.issue.pull_request
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Grill the issue
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          claude_args: |
            --allowedTools "mcp__github__update_issue,Read,Grep,Glob,WebFetch"
          prompt: |
            You are grilling a GitHub issue on the Epping Forest Finds project
            before any code gets written against it, using the same discipline as
            this repo's `/grilling` skill (see `.claude/skills/grilling/SKILL.md`).
            You already have the issue body and the full comment thread (including
            any of your own prior clarifying-questions messages) in context — do
            not run any commands to fetch them.

            Every run posts its own fresh tracking comment, regardless of whether
            you were triggered by an issue edit or a new comment. Earlier runs'
            comments are never deleted or edited by you — the full history of
            questions and answers stays visible on the issue for anyone reviewing
            it later. Don't reference your own older comments; just write this
            run's update as a new one.

            You have read-only access to this checkout (Read/Grep/Glob), including
            everything under `data/`. Use it: when a report makes a factual claim
            about something on the map (a place has closed, moved, renamed, or is
            mis-categorised), check it against the actual data file
            (`data/local-landmarks-food.geojson`, `data/local-landmarks-misc.geojson`,
            `data/business-watch.json`, `data/verification.json`, etc.) before
            treating it as settled, and say in your confirmation whether you could
            confirm it, not just that the reporter said it. The same applies to a
            report of a missing forest event, road/access closure, or standing
            visit notice: check `data/forest-events.json`, `data/road-closures.json`
            and `data/forest-notices.json` to confirm it isn't already listed.

            As your very first action, before reading anything else, set your
            tracking comment to just "🤔 Thinking…" — a plain in-progress
            indicator with no question list, since the old statuses would be
            stale and confusing sitting under a "thinking" label. Replace the
            whole comment with the real, updated content below once you're done.

            Ground yourself first by reading:
            - CLAUDE.md
            - spec/spec.md
            - spec/spec-data-rendering.md
            - spec/spec-data-fetching.md
            - spec/spec-admin.md
            - spec/spec-icons.md
            - spec/glossary.md

            Case 1 — you have not asked clarifying questions on this issue yet:
            Write 3-5 focused numbered questions (with a short friendly intro line)
            that surface real ambiguities in scope, UX behaviour, data handling,
            architecture (which file owns the logic: renderer, inspector, nav,
            categories, tracker), performance, or spec alignment. Skip anything
            already clearly answered in the issue body. If a fact can be settled
            by reading the spec files or the codebase, don't ask it.

            Case 2 — you already asked clarifying questions (visible earlier in
            this comment thread or issue history): re-evaluate them against
            everything since — the edited description, and/or any replies.
            Write out the full list again, in full, following these rules:
            - Keep every original question with its original number and wording,
              never renumber or remove one.
            - Prefix each question with a status emoji: 🟢 clearly and fully
              answered, 🟡 partially answered or needs more detail, 🔴 not yet
              answered.
            - For 🟢/🟡 questions, add a one-line blockquote directly below summarising
              what was understood.
            - Only if something important is still genuinely missing, append new
              questions at the end, continuing the numbering (e.g. after 5, next is 6).
              Err strongly toward not adding new ones.
            - Keep the original intro line.

            Once every question is 🟢, decide whether this is fundamentally a
            **bug** (the clarified behaviour contradicts something already
            documented in the spec files) or a **feature request** (it proposes
            behaviour the spec doesn't cover yet) — regardless of which template
            the issue originally used. Read `.github/ISSUE_TEMPLATE/bug_report.md`
            and `.github/ISSUE_TEMPLATE/feature_request.md` and use the matching
            one's headings. Then use the update_issue tool to rewrite the issue
            body itself with those headings, filling in the clarified answers so
            it's fully self-contained. If you switched template from the
            original, say so in one line in your confirmation below.

            Next decide, now that it's clarified and you've checked it against
            the data, whether this is a **simple, confirmed data change** of
            one of two kinds:

            1. A factual fix to one existing mapped place (it closed, renamed,
               moved, or is mis-categorised) that your data check above
               actually confirmed.
            2. A new entry for `data/forest-events.json`, `data/road-closures.json`
               or `data/forest-notices.json` — a dated event, road/access
               closure, or standing visit notice — where the issue cites a
               specific source URL for the date and details, and your check
               above confirmed it is not already listed. Verifying this one
               means fetching the cited source URL yourself with WebFetch and
               confirming the page actually supports the date, venue and
               details claimed — not taking the issue's word for what it
               says. If the issue gives no source URL, or the URL doesn't
               load or doesn't support the claim, that is a clarifying
               question to ask (case 1/2 above), not something to confirm on
               trust.

            Either way, there must be no design decision left for a person to
            make (which category it belongs in, how to phrase it, whether it's
            a one-off or recurring are all judgement calls — ask rather than
            guess). If confirmed, use the update_issue tool to add the `claude`
            label — that hands it straight to this repo's implementation
            workflow (`claude-issue-agent.yml`), which will make the data
            change (citing the same source URL for a new entry) and open a
            pull request on its own, no human labelling needed. Say so plainly
            in your confirmation (e.g. "🔧 Confirmed against the data —
            labelled for an automatic fix." or "📅 Source cited and not
            already listed — labelled to add it automatically."). Do not add
            the label for anything else: feature work, anything you couldn't
            confirm, or anything that still needs a person's judgement call —
            leave those for a human to label.

            Then decide whether this also needs a **spec update**. A data
            change like either kind above is never a spec change by itself —
            fixing the place's name/status/location, or adding a sourced
            event/closure/notice entry, is the whole fix, and a spec file must
            never carry a specific place's or event's facts as documentation.
            Only look for a spec change when the clarified issue
            reveals an actual gap in behaviour, UX, categorisation rules, or
            architecture. When one applies, work out which `spec/*.md` file(s)
            (per the list in `CLAUDE.md`) would need updating, read the affected
            section(s), and draft a suggested diff — do not edit any file on
            disk, just compose it by hand as a unified diff in a ```diff code
            block (with `--- a/...` / `+++ b/...` file headers). This is a
            preview for whoever implements the issue, not a change you're making
            now.

            Post/update a short confirmation (e.g. "✅ All clarified — issue
            description updated.") instead of repeating the question list,
            followed by "**Suggested spec update:**" and the diff block. If no
            spec change would be needed — including because this is a pure data
            correction — say so explicitly, and why, instead of a diff.

            Do not create a branch, commit any code, or open a PR yourself —
            this workflow only clarifies requirements and, where confirmed,
            hands off via the `claude` label to the workflow that does.
