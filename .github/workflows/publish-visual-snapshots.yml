name: Publish visual snapshots

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  # A new push supersedes an older snapshot run. The resolver below also checks the head SHA,
  # so an already-running publisher cannot commit renders from an outdated PR revision.
  group: visual-snapshot-publisher-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the current pull request head
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const candidate = run.pull_requests?.[0];
            if (!candidate) {
              core.setOutput('process', 'false');
              return;
            }

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: candidate.number,
            });

            // Never publish or commit a stale run after another PR push has arrived.
            if (pr.state !== 'open' || pr.head.sha !== run.head_sha) {
              core.info(`Skipping stale or closed PR run: ${run.head_sha}`);
              core.setOutput('process', 'false');
              return;
            }

            core.setOutput('process', 'true');
            core.setOutput('number', String(pr.number));
            core.setOutput('head_sha', pr.head.sha);
            core.setOutput('head_repository', pr.head.repo.full_name);

      - name: Download visual snapshot candidates
        if: steps.pr.outputs.process == 'true'
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: playwright-visual-candidates
          path: ${{ runner.temp }}/visual-candidates
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Check out the trusted publisher
        if: steps.pr.outputs.process == 'true'
        uses: actions/checkout@v5

      - name: Preserve the trusted publisher
        if: steps.pr.outputs.process == 'true'
        run: |
          cp .github/scripts/publish-visual-diffs.sh "$RUNNER_TEMP/publish-visual-diffs.sh"
          cp .github/scripts/render-visual-section.cjs "$RUNNER_TEMP/render-visual-section.cjs"

      - name: Publish baseline, actual, and diff images
        if: steps.pr.outputs.process == 'true'
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          HEAD_REPOSITORY: ${{ steps.pr.outputs.head_repository }}
          PAT: ${{ secrets.WEEKLY_LEDGER_PAT }}
          CANDIDATES: ${{ runner.temp }}/visual-candidates
          VISUAL_RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: bash "$RUNNER_TEMP/publish-visual-diffs.sh"

      - name: Update the PR description
        if: steps.pr.outputs.process == 'true'
        uses: actions/github-script@v7
        env:
          SECTION_FILE: ${{ runner.temp }}/visual-section.md
          HEAD_REPOSITORY: ${{ steps.pr.outputs.head_repository }}
        with:
          script: |
            const fs = require('fs');
            const { updateDescription } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/update-visual-description.cjs`);
            await updateDescription({
              github, context, log: (message) => core.info(message),
              prNumber: Number('${{ steps.pr.outputs.number }}'),
              expectedSha: '${{ steps.pr.outputs.head_sha }}',
              section: fs.readFileSync(process.env.SECTION_FILE, 'utf8').trim(),
            });
