name: Weekly Epping Forest Ledger

# Runs entirely on GitHub's servers -- no laptop or local device needed.
#
# NOTE on the cron time: GitHub Actions cron is UTC only, no DST awareness.
# 01:00 UTC is 2am in the UK during BST (roughly late Mar-late Oct) and 1am
# during GMT (winter) -- an hour early for part of the year. Adjust if that
# matters to you.
#
# NOTE on github_token: passed explicitly below to work around a currently
# open bug in anthropics/claude-code-action where its default GitHub App
# authentication fails specifically on schedule-triggered runs (works fine
# on workflow_dispatch) -- see https://github.com/anthropics/claude-code-action/issues/814.
# Side effect: a push/PR made with this job's own GITHUB_TOKEN does not
# retrigger this repo's separate ci.yml workflow (GitHub's anti-recursion
# rule for the default token). Rather than have Claude run the test suites
# itself as a safety gate (a past run backgrounded the slow e2e suite,
# said it would "resume once notified", and the job just ended there with
# nothing committed -- there is no "later" in a single Actions run), this
# job now explicitly dispatches ci.yml on the branch it pushes (step 4e)
# so the normal unit/e2e checks show up on the PR for Simon to review.
on:
  schedule:
    - cron: "0 1 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  id-token: write
  actions: write

jobs:
  weekly-ledger:
    name: Research, propose, test and merge this week's changes
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          show_full_output: true
          prompt: |
            You are producing the weekly "Epping Forest Ledger" report for
            this repository (simonmcmanus/epping-forest-finds) -- a PWA
            showing an offline map of Epping Forest (shops, cafes,
            restaurants, pubs, roads, paths, landmarks). This run is fully
            unattended: no laptop, no human watching. You have a normal
            checkout of `main` on this runner and a real shell (Bash) --
            work directly in it, there is no dirty working tree to protect
            here (unlike a local run).

            SCOPE: research this week's changes, apply them to the food
            dataset, test, commit, push, and open a PR for Simon to review.
            AUTO-MERGE IS TEMPORARILY DISABLED while Simon tests this
            workflow -- do NOT run `gh pr merge` under any circumstances,
            even if every test passes. Open the PR and stop. Never
            fabricate findings; if you can't verify something, say so and
            leave it for a human instead of guessing.

            HOUSEKEEPING (do this first, before any research): this workflow
            can be re-run manually the same day (workflow_dispatch), e.g.
            because an earlier run today was blocked by something unrelated
            to the actual data (a flaky test, an API outage). Run
            `gh pr list --state open --json number,headRefName,title` and
            check any PR whose head branch matches
            `weekly-data-report/<today's date>*`. If you find one AND its
            branch's diff against main touches no file under `data/`
            (i.e. it only carries a report, or nothing at all -- a prior
            attempt that didn't get as far as a real data change), close it
            with `gh pr close <number> --comment "Superseded by a re-run of
            this workflow later the same day."` before continuing. Leave
            alone any same-day PR that DID change a `data/` file -- that is
            a real, reviewable proposal and must never be closed
            automatically just because a newer run exists.

            Coverage settlements: Loughton, Chingford, Buckhurst Hill,
            Chigwell, Theydon Bois, Epping, Woodford Green, Waltham Abbey.

            Tooling already in this repo:
            - scripts/apply_weekly_changeset.py -- applies a changeset JSON
              ({"add":[...], "remove":[...]}) to the food dataset. Read its
              docstring: on this runner data/local-landmarks.geojson (the
              master file) does not exist -- it's gitignored, local-only --
              so this script automatically edits
              data/local-landmarks-food.geojson directly instead. That is
              expected; do not try to reconstruct or fetch the master file.
            - scripts/osm_business_diff.py -- queries OpenStreetMap directly
              and diffs it against data/local-landmarks-food.geojson, so you
              don't have to guess which of 680+ points might have changed.
              Run it plain (python3 scripts/osm_business_diff.py) and read
              its JSON output.
            - scripts/cow_boundary_tracker.py -- checks whether the forest's
              grazing cattle have moved to a different paddock since last
              run, and if so, builds a plain-English description of roughly
              where. Run it plain (python3 scripts/cow_boundary_tracker.py)
              and use its JSON output directly as your report-data.json's
              "grazing" field.
            - scripts/report/render_report.py -- turns a small JSON file
              into the finished report page (design, map, point-count stats
              -- all of it). You do NOT hand-write the report's HTML or SVG
              map. Read scripts/report/report-data.schema.md for the exact
              JSON shape, then run:
                python3 scripts/report/render_report.py <report-data.json>
              It writes reports/epping-forest-ledger-<date>.html itself and
              refuses to write anything containing technical jargon (file
              names, OSM ids, branch/PR/git talk) -- if it errors for that
              reason, rewrite the offending sentence in report-data.json in
              plain English and run it again. See step 6.

            What to do, in order:

            1. Get today's date. Read data/local-landmarks-food.geojson to
               get the current point count / category breakdown.

            2. Research this week's changes:
               a. Business closures/openings: web-search news for each
                  settlement. Check each candidate against
                  data/local-landmarks-food.geojson by name before treating
                  it as a real gap.
               b. FSA cross-check (food category only, best-effort): the UK
                  Food Standards Agency Food Hygiene Rating Scheme API at
                  https://api.ratings.food.gov.uk needs no API key but
                  requires the header `x-api-version: 2`. Use curl (you have
                  network access on this runner). Check
                  https://api.ratings.food.gov.uk/Help yourself for the
                  current Establishments search parameters -- these were
                  not reliably confirmed as of when this workflow was
                  written. If it doesn't work, say so in the report rather
                  than fabricating results; don't let it block anything else.
               c. Road closures & roadworks -- highways AND utilities, not
                  highways alone (a past run missed real, ongoing utility
                  diversions entirely, see below):
                  https://www.eppingforestdc.gov.uk/advance-notice-of-epping-road-closures
                  and Essex Highways for highway schemes; separately,
                  https://www.thameswater.co.uk/about-us/projects/improvements-in-your-area/london
                  for Thames Water mains/repair projects (check it every
                  run -- it's a static project list, not paginated news, so
                  re-fetching it fresh each week is cheap and reliable) --
                  scan every project listed for a location matching any
                  coverage settlement, not just ones with "Loughton" etc.
                  literally in the project name. Known standing item: the
                  High Beech, Loughton water mains replacement (started
                  March 2026, ~3-year multi-phase project across Spareleaze
                  Hill, Queens Road, Debden Lane, Newmans Lane, Rectory Lane
                  and ~15 other streets) is long-running and easy for a
                  fresh news search to miss entirely since it isn't "new" --
                  re-check its project page each run for the current
                  phase/street/dates rather than assuming last week's is
                  still accurate, the same way you'd track any other
                  multi-week roadworks scheme. Also run a per-settlement
                  search along the lines of "Thames Water roadworks OR
                  diversion <settlement>" the same way you do for business
                  openings/closures in step 2a, since Thames Water's own
                  project list can lag behind what's actually dug up on the
                  ground.
               d. Forest events:
                  https://www.cityoflondon.gov.uk/things-to-do/green-spaces/epping-forest/whats-new-in-epping-forest
                  and https://www.eppingforestdc.gov.uk/whats-on-in-epping-forest/.
               e. For each finding, look up its real coordinates in
                  data/local-roads.geojson or data/local-landmarks-food.geojson
                  rather than guessing -- put them in report-data.json's
                  "lon"/"lat" fields and the render script places the pin for
                  you; there's no map formula to copy by hand any more.
               f. Follow up on anything the previous report flagged as
                  "possible" instead of re-flagging it fresh.
               g. Small independent business turnover (the gap general news
                  search misses): run python3 scripts/osm_business_diff.py.
                  Its "new_candidates" are OSM points not on the map yet
                  (possible openings/gaps worth a look); its
                  "missing_candidates" are map points OSM no longer lists
                  (possibly closed -- OSM can simply be out of date, so treat
                  this as "worth checking", never as confirmed on its own).
                  Cross-check anything promising the same way you would a
                  news search result before treating it as confident.
               h. The forest's grazing cattle: run
                  python3 scripts/cow_boundary_tracker.py. It compares this
                  run's Nofence grazing boundary against last run's and
                  prints ready-to-use JSON -- if "moved" is true, the cattle
                  have moved paddocks since last run and it names roughly
                  where; use its output directly as report-data.json's
                  "grazing" field either way (moved or not).

            3. Build a changeset for every business finding you're
               reasonably confident about (name, category, coordinates) --
               from your own research or from scripts/osm_business_diff.py's
               candidates:
               {"add": [{"name":..., "category":..., "lon":..., "lat":...,
               "address":..., "website":...}], "remove": [{"name":...,
               "reason":...}]}. Valid categories are in
               apply_weekly_changeset.py's VALID_FOOD_CATEGORIES. Anything
               you're not confident about still belongs in report-data.json
               as a finding -- just say plainly in its "body" text that it
               needs checking (e.g. "not confirmed yet, worth a look"),
               rather than leaving it out or guessing.

            4. If the changeset is non-empty:
               a. Create a branch:
                  git checkout -b weekly-data-report/<date>-${{ github.run_number }}
                  (the run-number suffix keeps this collision-free from any
                  branch a same-day re-run of this workflow already pushed --
                  see HOUSEKEEPING above)
               b. Run: python3 scripts/apply_weekly_changeset.py <changeset.json>
                  and confirm it reports success. This is the script's own
                  lightweight self-check, not a substitute for the real test
                  suites -- do NOT run node --test or npx playwright
                  yourself, and do NOT background either of them "to check
                  back later": there is no later in a single unattended
                  Actions run, and a past run did exactly this (backgrounded
                  the slow e2e suite, said it would resume once notified),
                  which just ended the job with nothing committed. The real
                  test suites run as normal CI checks on the PR instead
                  (step e below) -- that's Simon's and CI's job to wait on,
                  not yours.
               c. git add the changed data file(s), the new report, and
                  data/cow-grazing-history.json if cow_boundary_tracker.py
                  updated it (see step 6), commit
                  (git config user.name "Epping Forest Ledger (weekly report)",
                  user.email "weekly-report@local", scoped to this checkout
                  only), and git push -u origin
                  weekly-data-report/<date>-${{ github.run_number }}.
               d. Open a PR: gh pr create --title "..." --body "..." listing
                  exactly what was added/removed and why.
               e. Explicitly start CI on this PR:
                  gh workflow run ci.yml --ref weekly-data-report/<date>-${{ github.run_number }}
                  This step is required, not optional -- a PR opened with
                  this job's own GITHUB_TOKEN does NOT trigger ci.yml's
                  normal pull_request event (GitHub's anti-recursion rule
                  for the default token), so without this explicit dispatch
                  the PR would show no checks at all for Simon to review.
               f. Add a report preview link to the PR body (see REPORT
                  PREVIEW LINK below) -- do this for every PR this workflow
                  opens, this one included. Also mention in the PR body
                  that CI was triggered explicitly (step e) and that Simon
                  should wait for those checks to go green before merging.
               g. Do NOT merge the PR. Auto-merge is temporarily
                  disabled while this workflow is being tested -- leave it
                  open for Simon to review and merge by hand once CI passes.
                  Say so plainly in the PR body and in your final summary.
            5. If the changeset is empty, skip the data branch/PR/merge
               entirely and say so in the report -- but still open the
               small standalone report-only PR described in step 6 (and
               still run step 4e's gh workflow run against its branch, so
               the report-only change gets checked too), and it still
               needs the REPORT PREVIEW LINK below.

            REPORT PREVIEW LINK: this site's Netlify Deploy Previews are
            always reachable at a fixed, predictable address --
            `https://deploy-preview-<PR_NUMBER>--epping-forest.netlify.app/<path>`
            -- no API lookup needed, just the PR number `gh pr create` (or
            `gh pr view --json number -q .number`) gives you. Once the PR
            exists, build the report's URL from that pattern, e.g.
            `https://deploy-preview-42--epping-forest.netlify.app/reports/epping-forest-ledger-<date>.html`,
            and put it near the top of the PR body with
            `gh pr edit <number> --body "..."` (rewrite the full body: keep
            everything the initial `gh pr create` body had, just add this
            near the top), roughly:
              **Report preview:** <url>
              (Netlify usually finishes building the preview within a
              minute or two of the PR opening -- if the link 404s right
              away, give it a moment and reload.)

            6. Build reports/epping-forest-ledger-<date>.html by writing a
               report-data.json (see scripts/report/report-data.schema.md)
               to /tmp/report-data.json -- outside the repo, so there's
               nothing to clean up or risk committing by mistake -- and
               running:
                 python3 scripts/report/render_report.py /tmp/report-data.json
               Only the rendered HTML this produces gets committed, as part
               of the same branch/PR as the data change (or, if the
               changeset was empty, on a small standalone branch/PR of its
               own, same merge rule).

               Write every finding for a general reader who has never seen
               this project -- no file names, OSM ids, branch names, or
               git/PR/CI talk (the render script itself will refuse to write
               the report if any of that shows up in the visible text, so
               treat an error from it as "rewrite this sentence in plain
               English" and try again). Auto-merge is temporarily disabled
               while this workflow is being tested, so phrase anything
               sitting on the open PR as proposed and pending a quick
               review -- e.g. "we'd like to remove this" rather than "this
               has been removed" -- never as already live on the map. Once
               Simon re-enables auto-merge, switch to describing changes as
               already made. report-data.json's "about_note" field can
               mention the FSA check status or any other honest caveat in
               plain language if it's worth flagging that week -- keep it
               short and reader-facing, not a developer changelog.

            7. End with a short plain-text summary in the workflow log:
               what changed, whether it merged, and anything that needs a
               human's attention.
          # NOTE: Bash(gh pr merge:*) is deliberately left out of claude_args
          # below -- auto-merge is disabled while Simon tests this workflow.
          # Add it back (and flip the prompt language above) once he is happy.
          claude_args: |
            --allowedTools "Read,Write,Glob,Grep,WebSearch,WebFetch,Bash(git checkout:*),Bash(git branch:*),Bash(git add:*),Bash(git commit:*),Bash(git config:*),Bash(git push:*),Bash(git diff:*),Bash(git log:*),Bash(git status:*),Bash(git rev-parse:*),Bash(npm ci:*),Bash(python3:*),Bash(curl:*),Bash(date:*),Bash(gh pr create:*),Bash(gh pr list:*),Bash(gh pr close:*),Bash(gh pr edit:*),Bash(gh pr view:*),Bash(gh workflow run:*)"
