name: Update Snapshots

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to update snapshots on
        required: false
        default: main

jobs:
  update:
    name: Regenerate snapshot baselines
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.branch }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Regenerate all snapshot baselines
        id: e2e
        run: npx playwright test --update-snapshots=all
        continue-on-error: true
      - name: Commit updated baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/e2e/__screenshots__/
          if ! git diff --staged --quiet; then
            git commit -m "chore: update CI snapshot baselines [skip ci]"
            git push origin HEAD:${{ github.event.inputs.branch }}
          fi
      - name: Fail if any test had a non-screenshot failure
        if: steps.e2e.outcome == 'failure'
        run: exit 1
