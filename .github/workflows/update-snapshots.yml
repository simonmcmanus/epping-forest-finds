name: Update Snapshots

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to update snapshots on
        required: false
        default: main

jobs:
  update:
    name: Regenerate snapshot baselines
    runs-on: ubuntu-latest
    # Pinned to the same image/tag as ci.yml's e2e and visual-snapshots jobs -- see the
    # comment there. Bump both together with @playwright/test in package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.branch }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Regenerate all snapshot baselines
        id: e2e
        # Mobile only: every toHaveScreenshot() spec is skipped on desktop (see
        # test.skip(testInfo.project.name !== 'mobile') in each one), so running desktop here
        # only pays its setup and test time for zero screenshots.
        run: npx playwright test --project=mobile --update-snapshots=all
        continue-on-error: true
      - name: Commit updated baselines
        # See the matching comment in ci.yml's visual-snapshots job: without the explicit cd +
        # safe.directory, git fails outright ("fatal: not in a git directory") in this
        # container image.
        run: |
          cd "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/e2e/__screenshots__/
          if ! git diff --staged --quiet; then
            git commit -m "chore: update CI snapshot baselines [skip ci]"
            git push origin HEAD:${{ github.event.inputs.branch }}
          fi
      - name: Fail if any test had a non-screenshot failure
        if: steps.e2e.outcome == 'failure'
        run: exit 1
