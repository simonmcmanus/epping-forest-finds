name: Merge after human and agent approval

# The PR is armed (or merged) only when the CURRENT head has BOTH:
#   1. an approving review from a person who is an OWNER, MEMBER or
#      COLLABORATOR of the repository (author_association on the review), and
#   2. an approving review from the CI Claude reviewer (github-actions[bot])
#      carrying its CLAUDE_FINAL_REVIEW:<head>:<base> marker, where <base> is
#      the PR's live base SHA.
# Either approval can arrive last, so this runs on each approving review and
# again when the CI run that publishes the agent review completes. Both can
# land while the PR is still a draft (the review jobs run on drafts), and a
# draft is never armed, so marking the PR ready re-evaluates too.
# Agents never arm or merge themselves.
#
# Order of operations: first try native auto-merge (enablePullRequestAutoMerge).
# GitHub rejects that mutation when the PR is already mergeable ("clean
# status"), which is the normal case when the human approves last. Then this
# workflow merges directly with the same App token, squash, pinned to the head
# SHA (--match-head-commit), only after the same both-approvals checks passed.
# "Already enabled" (two events racing) counts as success.
#
# Self-approval caveat: PRs opened by agents are authored through the owner's
# account, and GitHub forbids approving your own PR, so the human approval
# this needs may be impossible on such PRs. That is a known limitation, not
# worked around here (a different account must approve, or merge manually).
#
# Branch protection still gates every merge (required checks and approvals);
# the settings below are repository configuration, not enforced by this file:
# - Settings > General > Allow auto-merge: on.
# - Branch ruleset on main: require 2 approving reviews (one person and the
#   agent), require status checks, dismiss stale approvals on new pushes.
#   Verify GitHub counts the github-actions[bot] APPROVE toward required
#   approvals; if it does not, this workflow still gates on it.
#
# Uses the dedicated GitHub App token, not GITHUB_TOKEN, so the merge still
# fires push-triggered workflows on main (for example cache-version-bump).
# The ready_for_review trigger uses pull_request_target so the default-branch
# copy of this file runs; there is no checkout of PR code, and PR number and
# head SHA come only from github.event.pull_request. Workflow changes take
# effect for pull_request_review, workflow_run and pull_request_target only
# once this file is on main.
on:
  pull_request_target:
    types: [ready_for_review]
  pull_request_review:
    types: [submitted]
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

jobs:
  arm:
    name: Arm or merge when both approvals are present
    if: >-
      (github.event_name == 'pull_request_target' &&
        github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'pull_request_review' &&
        github.event.review.state == 'approved' &&
        github.event.review.user.type == 'User' &&
        github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CACHE_VERSION_APP_ID }}
          private-key: ${{ secrets.CACHE_VERSION_APP_PRIVATE_KEY }}

      - name: Arm or squash-merge if both approvals are on the head
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ (github.event_name == 'pull_request_review' || github.event_name == 'pull_request_target') && github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number }}
          HEAD_SHA: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.event_name == 'pull_request_review' && github.event.review.commit_id || github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
            echo "No pull request for this run; nothing to arm."
            exit 0
          fi

          pr=$(gh api "repos/$REPO/pulls/$PR_NUMBER")
          if [ "$(jq -r .state <<<"$pr")" != "open" ] ||
             [ "$(jq -r .draft <<<"$pr")" != "false" ] ||
             [ "$(jq -r .head.sha <<<"$pr")" != "$HEAD_SHA" ]; then
            echo "PR is closed, a draft, or on a newer head; not arming for $HEAD_SHA."
            exit 0
          fi
          if [ "$(jq -r '.auto_merge != null' <<<"$pr")" = "true" ]; then
            echo "Auto-merge is already enabled on this PR."
            exit 0
          fi

          reviews=$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/reviews" | jq -s 'add // []')
          # Each reviewer's latest decision on this head, ignoring plain comments.
          # A later CHANGES_REQUESTED or DISMISSED supersedes an earlier approval.
          latest=$(jq --arg sha "$HEAD_SHA" '
            [.[] | select(.commit_id == $sha and .state != "COMMENTED")]
            | group_by(.user.login)
            | map(sort_by(.id) | last)' <<<"$reviews")
          human=$(jq '[.[] | select(.user.type == "User" and .state == "APPROVED"
               and (.author_association == "OWNER" or .author_association == "MEMBER"
                    or .author_association == "COLLABORATOR"))] | length' <<<"$latest")
          base_sha=$(jq -r .base.sha <<<"$pr")
          marker="CLAUDE_FINAL_REVIEW:${HEAD_SHA}:${base_sha}"
          agent=$(jq --arg marker "$marker" \
            '[.[] | select(.user.login == "github-actions[bot]" and .state == "APPROVED"
               and ((.body // "") | contains($marker)))] | length' <<<"$latest")
          if [ "$human" -lt 1 ] || [ "$agent" -lt 1 ]; then
            echo "Waiting on approvals for $HEAD_SHA: human=$human agent=$agent. Not arming."
            exit 0
          fi

          node_id=$(jq -r .node_id <<<"$pr")
          if out=$(gh api graphql -f query='
            mutation($id: ID!) {
              enablePullRequestAutoMerge(input: {pullRequestId: $id, mergeMethod: SQUASH}) {
                pullRequest { number autoMergeRequest { enabledAt } }
              }
            }' -f id="$node_id" 2>&1); then
            echo "Auto-merge armed for PR #$PR_NUMBER on $HEAD_SHA (human=$human agent=$agent)."
          elif grep -qi 'already enabled' <<<"$out"; then
            echo "Auto-merge was already enabled (concurrent event)."
          elif grep -qiE 'clean status|already.*(mergeable|clean)' <<<"$out"; then
            # Already mergeable, so GitHub refuses to arm. Merge now; branch
            # protection still decides whether this is allowed.
            echo "PR is already mergeable; merging directly."
            gh pr merge "$PR_NUMBER" --repo "$REPO" --squash --match-head-commit "$HEAD_SHA"
            echo "Merged PR #$PR_NUMBER on $HEAD_SHA (human=$human agent=$agent)."
          else
            echo "$out" >&2
            exit 1
          fi
