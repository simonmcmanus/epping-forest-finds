name: Update deploy preview links

on:
  status:

permissions:
  contents: read
  pull-requests: write

jobs:
  update-pr:
    # Netlify publishes deploy previews as the legacy `deploy/netlify` commit status, whose
    # target URL is the preview. Production and other status providers must not rewrite PRs.
    if: >-
      github.event.state == 'success' &&
      github.event.context == 'deploy/netlify' &&
      github.event.target_url
    runs-on: ubuntu-latest
    steps:
      - name: Add deploy-preview test links to the pull request
        uses: actions/github-script@v7
        with:
          script: |
            const previewUrl = context.payload.target_url.replace(/\/$/, "");
            const sha = context.payload.sha;
            const { data: pullRequests } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: sha,
            });

            const categoryGroups = [
              ["nature", "data/icons/nature.png", [["trees", "tree"], ["cows", "cow"], ["ponds-streams", "ponds"]]],
              ["food", "data/icons/food.png", [["pubs", "beer"], ["restaurants", "restaurant"], ["cafes", "cafe"], ["shops", "shop"]]],
              ["transport", "data/icons/bus.png", [["bus", "bus"], ["underground", "underground"], ["national-rail", "national-rail"], ["parking", "landmark-parking"]]],
              ["history", "data/icons/history.png", [["historic", "historic"], ["plaques", "plaques"], ["monuments", "landmark-monument"], ["ww2", "historic"]]],
              ["locations", "data/icons/landmark-parking.png", [["churches", "church"], ["education", "education"], ["medicine", "medicine"], ["campsites", "campsite"]]],
              ["stories", "data/icons/legends.png", [["legends", "legends"], ["literature", "literature"], ["film-tv", "film"], ["art", "art"]]],
              ["events", "data/icons/event.png", [["events", "event"]]],
            ];
            const htmlLink = (path) => `<a href="${previewUrl}${path}">${path}</a>`;
            const icon = (path) => `<img src="${previewUrl}/${path}" width="18" height="18" alt="">`;
            const routeIcon = (value) => value.startsWith("data/") ? icon(value) : value;
            const categoryCell = ([slug, categoryIcon, subcategories]) =>
              `<td>${icon(categoryIcon)} ${htmlLink(`/nearby/${slug}`)}<br>${subcategories.map(([subSlug, subIcon]) => `${icon(`data/icons/${subIcon}.png`)} ${htmlLink(`/nearby/${subSlug}`)}`).join("<br>")}</td>`;
            const categoryLinks = `<table>${categoryGroups.filter((_, index) => index % 3 === 0).map((left, rowIndex) => {
              const groups = categoryGroups.slice(rowIndex * 3, rowIndex * 3 + 3);
              return `<tr>${groups.map(categoryCell).join("")}${"<td></td>".repeat(3 - groups.length)}</tr>`;
            }).join("")}</table>`;
            const routes = [
              ["/", "data/icons/home.png"], ["/nearby", "data/icons/nearby.png"],
              ["/nearby/search", "🔎"], ["/nearby/filter", "data/icons/filter.png"],
              ["/settings", "data/icons/settings.png"], ["/feedback", "data/icons/feedback.png"],
              ["/admin", "data/icons/settings.png"], ["/reports/", "📄"],
              ["/terms.html", "📄"], ["/app", "↪️"],
            ];
            const routeLinks = `<table>${routes.filter((_, index) => index % 2 === 0).map((left, pairIndex) => {
              const right = routes[pairIndex * 2 + 1];
              return `<tr><td>${routeIcon(left[1])} ${htmlLink(left[0])}</td><td>${routeIcon(right[1])} ${htmlLink(right[0])}</td></tr>`;
            }).join("")}</table>`;
            const links = [
              "### Deploy preview",
              "",
              routeLinks,
              "",
              categoryLinks,
            ].join("\n");
            const marker = /<!-- preview-links:start -->[\s\S]*?<!-- preview-links:end -->/;

            for (const pr of pullRequests.filter((candidate) => candidate.state === "open")) {
              const body = pr.body || "";
              const replacement = `<!-- preview-links:start -->\n${links}\n<!-- preview-links:end -->`;
              const nextBody = marker.test(body)
                ? body.replace(marker, replacement)
                : `${body.trim()}\n\n${replacement}\n`;
              if (nextBody === body) continue;
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                body: nextBody,
              });
            }
