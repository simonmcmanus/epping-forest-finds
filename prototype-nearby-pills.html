<!doctype html>
<!-- PROTOTYPE (throwaway): Nearby filter pills + reward animation.
     Question: does tap-to-toggle pills on every Nearby screen feel slick, and which motion feels best?
     Variants via ?variant=A|B|C (or ←/→). Delete before merge; keep on a throwaway branch.
     Open: npm run dev, then /prototype-nearby-pills.html (or just double-click the file). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PROTOTYPE – Nearby pills</title>
<style>
:root{--bg:#f4f1ea;--card:#fff;--ink:#1f2a20;--mute:#6b7466;--accent:#2f6b3c;--accent-ink:#fff;--line:#e2ddd0;--ease-spring:cubic-bezier(.34,1.56,.64,1);--ease-out:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box}
body{margin:0;background:#cfc9b9;font:15px/1.35 system-ui,sans-serif;color:var(--ink);display:flex;justify-content:center}
.phone{position:relative;width:100%;max-width:420px;height:100vh;background:var(--bg);overflow:hidden;box-shadow:0 0 40px #0003}
.urlbar{font:12px ui-monospace,monospace;background:#222;color:#9f9;padding:6px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.screen{position:absolute;inset:27px 0 0 0;display:flex;flex-direction:column;background:var(--bg);transition:transform .38s var(--ease-out)}
#filtersScreen{transform:translateX(100%);z-index:3}
.phone.on-filters #filtersScreen{transform:none}
.phone.on-filters #nearbyScreen{transform:translateX(-18%)}
h1{margin:14px 16px 4px;font-size:20px}
.sub{margin:0 16px 8px;color:var(--mute);font-size:13px}
.sub b{display:inline-block;min-width:1ch}
.bump{animation:bump .35s var(--ease-spring)}
@keyframes bump{40%{transform:scale(1.5);color:var(--accent)}}
/* pill row */
.rail{display:flex;align-items:center;gap:8px;padding:6px 10px 10px;border-bottom:1px solid var(--line);background:var(--bg)}
.rail .scroll{position:relative;display:grid;grid-template-rows:repeat(var(--rows,2),40px);grid-auto-flow:column;grid-auto-columns:max-content;gap:8px;overflow-x:auto;flex:1;padding:4px 2px;scrollbar-width:none;mask-image:linear-gradient(90deg,transparent 0,#000 8px,#000 calc(100% - 14px),transparent)}
.scroll::-webkit-scrollbar{display:none}
.edge{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:18px;display:grid;place-items:center;cursor:pointer;transition:transform .15s,opacity .25s,background .2s}
.edge:active{transform:scale(.88)}
.edge[disabled]{opacity:.35;pointer-events:none}
.pill{flex:none;position:relative;overflow:hidden;display:flex;align-items:center;gap:6px;height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
.pill .fill{position:absolute;inset:0;background:var(--accent);transform:scaleX(0);transform-origin:left;z-index:0}
.pill>*:not(.fill):not(.rip){position:relative;z-index:1}
.pill.sel{color:var(--accent-ink);border-color:var(--accent)}
.pill.sel .fill{transform:none}
.pill .x{display:none}

.rip{position:absolute;border-radius:50%;background:#fff6;pointer-events:none;transform:scale(0);animation:rip .55s var(--ease-out) forwards}
@keyframes rip{to{transform:scale(1);opacity:0}}
/* list */
.list{flex:1;overflow:auto;padding:10px 12px;list-style:none;margin:0;position:relative}
.item{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:14px;padding:11px 12px;margin-bottom:8px;box-shadow:0 1px 2px #0001}
.item .ic{font-size:22px;width:34px;text-align:center}
.item .nm{font-weight:600}.item .mt{color:var(--mute);font-size:12.5px}
.item .d{margin-left:auto;font-size:12.5px;color:var(--mute)}
.empty{padding:40px 20px;text-align:center;color:var(--mute)}
/* filters screen */
.fhead{display:flex;align-items:center;gap:8px;padding:12px}
.fbody{padding:0 16px;color:var(--mute)}
.tag{display:inline-block;margin:3px;padding:6px 10px;border-radius:14px;background:var(--card);border:1px solid var(--line);color:var(--ink)}
/* switcher */
.sw{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);z-index:99;background:#111;color:#fff;border-radius:22px;padding:6px 10px;display:flex;gap:12px;align-items:center;font-size:13px;box-shadow:0 4px 18px #0006}
.sw button{background:none;border:0;color:#fff;font-size:18px;cursor:pointer;padding:2px 8px}

/* ===== Variant A: springy fill + staggered list ===== */
.vA .pill{transition:transform .45s var(--ease-spring),background .2s,color .2s}
.vA .pill .fill{transition:transform .35s var(--ease-out)}
.vA .pill.pop{animation:popA .5s var(--ease-spring)}
@keyframes popA{0%{transform:scale(.88)}55%{transform:scale(1.1)}100%{transform:scale(1)}}
.vA .item.enter{animation:inA .5s var(--ease-spring) both;animation-delay:calc(var(--i)*40ms)}
@keyframes inA{from{opacity:0;transform:translateY(16px) scale(.97)}}
.vA .item.leave{animation:outA .22s ease-in forwards}
@keyframes outA{to{opacity:0;transform:scale(.94)}}
/* ===== Variant B: ripple + selected pill glides to front + items grow from pill ===== */
.vB .pill{transition:background .2s,color .2s}
.vB .pill .fill{transition:transform .45s var(--ease-out)}
.vB .pill:active{transform:scale(.94)}
.vB .item.enter{animation:inB .42s var(--ease-out) both;animation-delay:calc(var(--i)*30ms);transform-origin:var(--ox,50%) 0}
@keyframes inB{from{opacity:0;transform:scaleY(.6) translateY(-10px)}}
.vB .item.leave{animation:outB .2s ease-in forwards}
@keyframes outB{to{opacity:0;transform:scaleY(.7)}}
.vB .item.flash{animation:flashB .9s ease-out}
@keyframes flashB{0%{box-shadow:0 0 0 3px #2f6b3c88}100%{box-shadow:0 1px 2px #0001}}
/* ===== Variant C: restrained – squish + only changed rows swap, haptic ===== */
.vC .pill{transition:transform .12s,background .15s,color .15s}
.vC .pill .fill{transition:transform .22s var(--ease-out)}
.vC .pill:active{transform:scale(.9)}
.vC .item.enter{animation:inC .28s var(--ease-out) both;animation-delay:calc(var(--i)*18ms)}
@keyframes inC{from{opacity:0;transform:translateX(14px)}}
.vC .item.leave{animation:outC .14s ease-in forwards}
@keyframes outC{to{opacity:0;transform:translateX(-14px)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="phone vA" id="phone">
  <div class="urlbar" id="url"></div>
  <div class="screen" id="nearbyScreen">
    <h1>Nearby</h1>
    <p class="sub"><b id="count">0</b> places · <span id="what"></span></p>
    <div class="rail">
      <button class="edge" id="showAll" aria-label="Show all nearby" title="Show all nearby">✕</button>
      <div class="scroll" id="pills"></div>
      <button class="edge" id="toFilters" aria-label="Filters" title="Filters">⚙︎</button>
    </div>
    <ul class="list" id="list"></ul>
  </div>
  <div class="screen" id="filtersScreen">
    <div class="fhead"><button class="edge" id="back">‹</button><b>Filters</b></div>
    <div class="fbody">This screen still slides in. Saved filters live here (prototype stub).<p id="saved"></p></div>
  </div>
</div>
<div class="sw"><button id="prev">←</button><span id="vlabel"></span><button id="rows" style="font-size:13px">rows: 2</button><button id="next">→</button></div>

<script>
// ---- mock data (shape mirrors FILTER_GROUPS in js/categories.js) ----
const GROUPS=[
 {key:"nature",label:"Nature",subs:[["trees","Trees","🌳"],["cows","Cows","🐄"],["ponds_streams","Ponds & streams","💧"]]},
 {key:"food",label:"Food",subs:[["pubs","Pubs & bars","🍺"],["restaurants","Restaurants","🍽️"],["cafes","Cafés","☕"],["shops","Shops","🛍️"]]},
 {key:"transport",label:"Transport",subs:[["bus","Bus stops","🚌"],["underground","Underground","🚇"],["parking","Car parks","🅿️"]]},
 {key:"history",label:"History",subs:[["historic","Historic sites","🏛️"],["plaques","Plaques","🪧"],["ww2","WWII sites","🎖️"]]},
];
const SUB=Object.fromEntries(GROUPS.flatMap(g=>g.subs.map(([k,l,e])=>[k,{key:k,label:l,emoji:e,group:g.key}])));
const N=[["Queen Elizabeth's Oak","trees",120],["Fairmead Beech","trees",260],["Pollard Hornbeam","trees",410],["Highland herd","cows",300],["Strawberry Hill Ponds","ponds_streams",350],["Baldwin's Pond","ponds_streams",520],["The Wake Arms","pubs",180],["The Robin Hood","pubs",640],["Forest Café","cafes",90],["Butler's Retreat","cafes",800],["Loughton Deli","shops",450],["Bus 20 · High Beach","bus",210],["Theydon Bois Station","underground",900],["Warlies Car Park","parking",330],["Queen Boadicea's Camp","historic",700],["Blue plaque · Tennyson","plaques",560],["Anti-aircraft site","ww2",610]]
 .map(([name,sub,d])=>({id:name,name,sub,d}));
const DEFAULT_PILLS=["trees","cows","pubs","cafes","bus","historic","ponds_streams","plaques"];

// ---- state: selected = ordered list of subfilter keys ----
let selected=[...(new URLSearchParams(location.search).get("show")?.split(",")||[])].filter(k=>SUB[k]);
let variant=(new URLSearchParams(location.search).get("variant")||"C").toUpperCase();

// Related pills: the siblings (same group) of everything selected, then that group's neighbours' headliners.
// Selected pills come first (stable order of selection), no duplicates.
// Stable order: pills never move because of a tap. Newly related pills are appended at the end,
// pills that are neither selected nor related any more drop out, everything else stays put.
let order=[...DEFAULT_PILLS];
function pillKeys(){
  const want=new Set(selected.length?selected:DEFAULT_PILLS);
  selected.forEach(s=>GROUPS.find(g=>g.key===SUB[s].group).subs.forEach(([k])=>want.add(k)));
  if(selected.length) DEFAULT_PILLS.forEach(k=>want.add(k));
  order=order.filter(k=>want.has(k));
  selected.forEach(s=>{if(!order.includes(s))order.push(s)});
  want.forEach(k=>{if(!order.includes(k))order.push(k)});
  return order;
}
const urlFor=()=>selected.length===0?"/nearby":selected.length===1?`/nearby/${selected[0].replace(/_/g,"-")}`:`/nearby?show=${selected.join(",")}`;

// ---- DOM helpers ----
const $=id=>document.getElementById(id), phone=$("phone");
const pillsEl=$("pills"), listEl=$("list");
const pillEls=new Map(), itemEls=new Map();

function visible(){return N.filter(n=>!selected.length||selected.includes(n.sub)).sort((a,b)=>a.d-b.d)}

function renderPills(tapped){
  const keys=pillKeys();
  const first=new Map([...pillEls].map(([k,el])=>{const r=el.getBoundingClientRect();return [k,[r.left,r.top]]}));
  keys.forEach(k=>{
    let el=pillEls.get(k);
    if(!el){
      el=document.createElement("button");el.className="pill";el.dataset.k=k;
      el.innerHTML=`<span class="fill"></span><span>${SUB[k].emoji}</span><span>${SUB[k].label}</span><span class="x">✕</span>`;
      el.addEventListener("click",e=>toggle(k,e));
      pillEls.set(k,el);
      if(first.size) el.animate([{opacity:0,transform:'scale(.7)'},{opacity:1,transform:'none'}],{duration:240,easing:'cubic-bezier(.2,.8,.2,1)'});
    }
    el.classList.toggle("sel",selected.includes(k));
    pillsEl.appendChild(el); // appending in order re-sorts DOM
  });
  [...pillEls].forEach(([k,el])=>{if(!keys.includes(k)){el.remove();pillEls.delete(k)}});
  // FLIP so pills glide into their new slot instead of jumping (the "keep clicking round" feel)
  const dur=variant==="C"?200:variant==="B"?420:480;
  pillEls.forEach((el,k)=>{
    const f=first.get(k); if(f==null) return;
    const r=el.getBoundingClientRect(),dx=f[0]-r.left,dy=f[1]-r.top; if(!dx&&!dy) return;
    el.animate([{transform:`translate(${dx}px,${dy}px)`},{transform:"none"}],{duration:dur,easing:variant==="A"?"cubic-bezier(.34,1.3,.64,1)":"cubic-bezier(.2,.8,.2,1)"});
  });
  $("showAll").disabled=!selected.length;
  // keep newest-selected pill in view
  if(tapped) pillEls.get(tapped)?.scrollIntoView({inline:"nearest",block:"nearest",behavior:"smooth"});
}

function renderList(originX){
  const vis=visible(), ids=new Set(vis.map(v=>v.id));
  // leave
  itemEls.forEach((el,id)=>{if(!ids.has(id)){itemEls.delete(id);el.classList.add("leave");el.addEventListener("animationend",()=>el.remove(),{once:true})}});
  const emptyEl=listEl.querySelector(".empty"); emptyEl?.remove();
  // FLIP survivors
  const first=new Map([...itemEls].map(([id,el])=>[id,el.getBoundingClientRect().top]));
  let i=0;
  vis.forEach(n=>{
    let el=itemEls.get(n.id);
    if(!el){
      el=document.createElement("li");el.className="item enter";el.style.setProperty("--i",i++);
      if(originX!=null) el.style.setProperty("--ox",originX+"px");
      el.innerHTML=`<span class="ic">${SUB[n.sub].emoji}</span><div><div class="nm">${n.name}</div><div class="mt">${SUB[n.sub].label}</div></div><span class="d">${n.d} m</span>`;
      el.addEventListener("animationend",()=>el.classList.remove("enter","flash"),{once:true});
      itemEls.set(n.id,el);
    }
    listEl.appendChild(el);
  });
  itemEls.forEach((el,id)=>{
    const f=first.get(id); if(f==null) return;
    const dy=f-el.getBoundingClientRect().top; if(!dy) return;
    el.animate([{transform:`translateY(${dy}px)`},{transform:"none"}],{duration:variant==="C"?220:380,easing:"cubic-bezier(.2,.8,.2,1)"});
  });
  if(!vis.length) listEl.insertAdjacentHTML("beforeend",`<li class="empty">Nothing here</li>`);
  const c=$("count"); c.textContent=vis.length; c.classList.remove("bump"); void c.offsetWidth; c.classList.add("bump");
  $("what").textContent=selected.length?selected.map(k=>SUB[k].label).join(" + "):"everything";
  $("url").textContent="app.example"+urlFor();
  $("saved").innerHTML=selected.map(k=>`<span class="tag">${SUB[k].label}</span>`).join("")||"No filters";
}

function toggle(k,e){
  const el=pillEls.get(k), r=el.getBoundingClientRect();
  const adding=!selected.includes(k);
  selected=adding?[...selected,k]:selected.filter(x=>x!==k);
  if(variant==="A"){el.classList.remove("pop");void el.offsetWidth;el.classList.add("pop")}
  if(variant==="B"){
    const rip=document.createElement("span");rip.className="rip";
    const s=Math.max(r.width,r.height)*2.2;
    Object.assign(rip.style,{width:s+"px",height:s+"px",left:(e.clientX-r.left-s/2)+"px",top:(e.clientY-r.top-s/2)+"px"});
    el.appendChild(rip);rip.addEventListener("animationend",()=>rip.remove());
  }
  if(variant==="C") navigator.vibrate?.(8);
  renderPills(adding?k:null);
  renderList(r.left+r.width/2-listEl.getBoundingClientRect().left);
  if(variant==="B"&&adding) requestAnimationFrame(()=>itemEls.forEach(el=>el.classList.contains("enter")&&el.classList.add("flash")));
}

$("showAll").onclick=()=>{selected=[];order=[...DEFAULT_PILLS];renderPills();renderList()};
$("toFilters").onclick=()=>phone.classList.add("on-filters");
$("back").onclick=()=>phone.classList.remove("on-filters");

function setVariant(v){
  variant=v;phone.className="phone v"+v+(phone.classList.contains("on-filters")?" on-filters":"");
  $("vlabel").textContent={A:"A · Springy",B:"B · Ripple + grow",C:"C · Crisp + haptic"}[v];
  const u=new URL(location);u.searchParams.set("variant",v);history.replaceState(null,"",u);
}
let rows=2;$("rows").onclick=()=>{rows=rows===2?1:2;$("rows").textContent="rows: "+rows;pillsEl.style.setProperty("--rows",rows)};
const V=["A","B","C"];
$("prev").onclick=()=>setVariant(V[(V.indexOf(variant)+2)%3]);
$("next").onclick=()=>setVariant(V[(V.indexOf(variant)+1)%3]);
addEventListener("keydown",e=>{if(e.key==="ArrowLeft")$("prev").click();if(e.key==="ArrowRight")$("next").click()});
if(!V.includes(variant))variant="C";
setVariant(variant);renderPills();renderList();
</script>
</body>
</html>
